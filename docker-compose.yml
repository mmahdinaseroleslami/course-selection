services:
  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: course-selection-api
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - course_data:/app/data

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  course_data:
    name: course_selection_data